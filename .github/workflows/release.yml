name: Orin Code installer

# Produces the actual Windows installer. The existing `orin-desktop.yml`
# workflow only typechecks, lints, and tests — it never produced a binary, so
# there was no way to install Orin Code from a release.
on:
  push:
    branches: [main]
    paths:
      - 'orin-desktop-app/**'
      - '.github/workflows/release.yml'
    tags: ['v*']
  # Build the installer on pull requests too. This is the only way the
  # installer path is verified before it merges — a workflow that only runs
  # after merge is exactly how a broken installer ships.
  pull_request:
    paths:
      - 'orin-desktop-app/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orin-desktop-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install renderer dependencies
        run: npm ci --prefix orin-desktop-app

      - name: Typecheck and lint
        run: |
          npm run typecheck --prefix orin-desktop-app
          npm run lint --prefix orin-desktop-app

      - name: Run renderer tests
        run: npm run test:ui --prefix orin-desktop-app

      - name: Test Rust bridge
        run: cargo test --manifest-path orin-desktop-app/src-tauri/Cargo.toml

      - name: Build the installer
        run: npm run app:build --prefix orin-desktop-app

      - name: Collect installer artifacts
        id: collect
        shell: pwsh
        run: |
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $files = Get-ChildItem -Path orin-desktop-app/src-tauri/target/release/bundle -Recurse -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) {
            Write-Error "No installer was produced. tauri build reported success but the bundle directory is empty."
            exit 1
          }
          foreach ($f in $files) { Copy-Item $f.FullName -Destination $out -Force }
          Get-ChildItem $out | ForEach-Object {
            "{0}`t{1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          } | Tee-Object -FilePath "$out/SIZES.txt"
          "version=$(Get-Content orin-desktop-app/src-tauri/tauri.conf.json | ConvertFrom-Json | Select-Object -ExpandProperty version)" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: orin-code-installer
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # gh does NOT pick up the runner's token on its own — it needs GH_TOKEN
        # set explicitly. This is the automatic GITHUB_TOKEN, not a stored
        # secret, and no credential is written into this file.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          # A tag pushed without a release would fail here, so create it first.
          # --verify-tag refuses to invent a tag that was not actually pushed.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "Orin Code $tag" --generate-notes
          }
          $files = Get-ChildItem -Path artifacts -Recurse -File |
                   Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) { throw "No installer files found under artifacts/." }

          # Upload through the REST API rather than `gh release upload`.
          # That subcommand glob-expands its own arguments, so on a Windows
          # runner the absolute path D:\a\... was parsed as a glob and the
          # upload silently did nothing while the step still exited 0.
          $releaseId = (gh release view $tag --json id -q .id --repo $repo).Trim()
          foreach ($f in $files) {
            $name = [uri]::EscapeDataString($f.Name)
            Write-Host "uploading $($f.Name)"
            gh api --method POST `
              -H "Content-Type: application/octet-stream" `
              "/repos/$repo/releases/$releaseId/assets?name=$name" `
              --input $f.FullName *> $null
            if ($LASTEXITCODE -ne 0) { throw "Upload failed for $($f.Name)" }
          }

          $attached = (gh release view $tag --json assets -q '.assets | length' --repo $repo).Trim()
          if ([int]$attached -lt 1) { throw "Release $tag has no assets after upload." }
          gh release view $tag --json url -q .url --repo $repo

  verify-manifest:
    name: installer versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The app must not ship a version older than its tag
        run: |
          set -euo pipefail
          app="orin-desktop-app"
          tauri=$(python3 -c "import json;print(json.load(open('$app/src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json;print(json.load(open('$app/package.json'))['version'])")
          cargo=$(grep -m1 '^version' "$app/src-tauri/Cargo.toml" | cut -d'"' -f2)
          echo "tauri=$tauri pkg=$pkg cargo=$cargo"
          if [ "$tauri" != "$pkg" ] || [ "$tauri" != "$cargo" ]; then
            echo "::error::versions disagree — tauri=$tauri pkg=$pkg cargo=$cargo"
            exit 1
          fi
          echo "All three manifests agree on $tauri."
