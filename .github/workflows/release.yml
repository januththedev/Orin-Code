name: Orin Code installer

# Produces the actual Windows installer and the updater package. The existing
# `orin-desktop.yml` workflow only typechecks, lints, and tests — it never
# produced a binary, so there was no way to install Orin Code from a release.
on:
  push:
    branches: [main]
    paths:
      - 'orin-desktop-app/**'
      - '.github/workflows/release.yml'
    tags: ['v*']
  # Build the installer on pull requests too. This is the only way the
  # installer path is verified before it merges — a workflow that only runs
  # after merge is exactly how a broken installer ships.
  pull_request:
    paths:
      - 'orin-desktop-app/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orin-desktop-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install renderer dependencies
        run: npm ci --prefix orin-desktop-app

      - name: Typecheck and lint
        run: |
          npm run typecheck --prefix orin-desktop-app
          npm run lint --prefix orin-desktop-app

      - name: Run renderer tests
        run: npm run test:ui --prefix orin-desktop-app

      - name: Test Rust bridge
        run: cargo test --manifest-path orin-desktop-app/src-tauri/Cargo.toml

      # createUpdaterArtifacts is enabled in tauri.conf.json, so this produces the
      # NSIS package, the updater archive, and latest.json — the file the
      # in-app updater reads. Without a signing key the updater archive is
      # unsigned, and the app's own signature gate refuses it, which is correct.
      - name: Build the installer and updater package
        id: build
        env:
          # Carried under a different name on purpose. An unset secret expands to
          # an empty string, and the Tauri CLI reads an empty
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD as "decrypt with an empty
          # password" and fails with "Missing comment in secret key". A missing
          # secret must be absent, not empty, so the real variable is only set
          # when there is something to set.
          ORIN_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ORIN_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrEmpty($env:ORIN_UPDATER_KEY)) {
            $env:TAURI_SIGNING_PRIVATE_KEY = $env:ORIN_UPDATER_KEY
            if (-not [string]::IsNullOrEmpty($env:ORIN_UPDATER_KEY_PASSWORD)) {
              $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:ORIN_UPDATER_KEY_PASSWORD
            }
            Write-Host "updater package will be signed"
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            "signed=false" >> $env:GITHUB_OUTPUT
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. The updater package will be unsigned and the in-app updater will refuse it. Set the repository secret to enable in-app updates."
          }
          # With a pubkey in tauri.conf.json, the Tauri CLI refuses to build
          # updater artifacts unless a private key is also present, which would
          # take the installer down with it. Without the secret, drop the updater
          # configuration for this build only: the installer still ships, and the
          # absence of an updater is a known limitation rather than a failure.
          if ([string]::IsNullOrEmpty($env:ORIN_UPDATER_KEY)) {
            $conf = 'orin-desktop-app/src-tauri/tauri.conf.json'
            $cfg = Get-Content $conf -Raw | ConvertFrom-Json
            $cfg.bundle.PSObject.Properties.Remove('createUpdaterArtifacts')
            if ($cfg.plugins) { $cfg.plugins.PSObject.Properties.Remove('updater') }
            $cfg | ConvertTo-Json -Depth 20 | Set-Content $conf -Encoding utf8
            Write-Host "::warning::No updater key. Building the installer without updater artifacts; the in-app updater is disabled for this build."
          }
          npm run app:build --prefix orin-desktop-app

      # Authenticode runs after the build, because the binaries must exist first.
      # The certificate is a base64 .pfx in a repository secret; it is written to
      # the runner's temp directory, used, and deleted in the same step, and it
      # never enters the repository or the log.
      # Guarded inside the script rather than with `if: ${{ secrets... }}`:
      # a step-level condition reading the secrets context is rejected outright
      # when the workflow also runs on pull_request.
      - name: Code sign (Windows Authenticode)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "::warning::WINDOWS_CERTIFICATE_BASE64 is not set; this build is unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          # Glob rather than a hardcoded filename: the setup .exe carries the
          # version in its name, and the version output step runs later.
          $targets = @()
          $targets += Get-ChildItem -Path "orin-desktop-app/src-tauri/target/release" -Filter "orin-code.exe" -File -ErrorAction SilentlyContinue
          $targets += Get-ChildItem -Path "orin-desktop-app/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue
          $targets = $targets | Sort-Object FullName -Unique
          if (-not $targets) { throw "No binaries found to sign." }
          foreach ($exe in $targets) {
            # Timestamped, so the signature outlives the certificate's own expiry.
            & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($exe.Name)" }
            Write-Host "signed $($exe.Name)"
          }
          Remove-Item -Force $pfx

      - name: Collect installer artifacts
        id: manifest
        shell: pwsh
        env:
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $release = "orin-desktop-app/src-tauri/target/release"

          # The installer, its updater signature, and the updater manifest.
          # .sig was missing from the first version of this filter, which
          # silently threw away the signature.
          # Scoped to the bundle directory on purpose. Scanning all of
          # target/release swept up hundreds of Cargo `build_script_build-*.exe`
          # files and published them as release assets.
          $bundle = Join-Path $release 'bundle'
          $installers = Get-ChildItem -Path $bundle -Recurse -File -ErrorAction SilentlyContinue |
                        Where-Object { $_.Extension -eq '.exe' -or $_.Extension -eq '.msi' }
          if (-not $installers) { Write-Error "No installer produced."; exit 1 }
          $sigs = Get-ChildItem -Path $bundle -Recurse -File -Filter '*.sig' -ErrorAction SilentlyContinue
          # GitHub replaces spaces in an uploaded asset name with dots, so
          # "Orin Code_1.8.0_x64-setup.exe" is published as
          # "Orin.Code_1.8.0_x64-setup.exe" and the manifest's percent-encoded
          # URL 404s. Publish a name with no spaces so the URL in the manifest
          # and the asset actually agree.
          foreach ($f in @($installers) + @($sigs)) {
            $name = $f.Name -replace '\s+', '-'
            Copy-Item $f.FullName -Destination (Join-Path $out $name) -Force
          }

          # The Tauri CLI signs the installer but never writes the manifest —
          # the string `latest.json` is absent from the CLI binary entirely.
          # Publishing it is the release process's job, so build it from the
          # signed artifacts that are actually on disk. The script refuses to
          # emit a manifest for an unsigned installer: an update the app cannot
          # verify is worse than no update.
          if ($env:SIGNED -eq 'true') {
            if (-not $sigs) { Write-Error "Signing was configured but no .sig was produced."; exit 1 }
            if (Get-ChildItem $out -File | Where-Object { $_.Name -match '\s' }) {
              Write-Error "An artifact name still contains whitespace; the manifest URL would not resolve."
              exit 1
            }
            $version = (Get-Content orin-desktop-app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
            node orin-desktop-app/scripts/make-latest-json.mjs --dir $out --version $version --repo "${{ github.repository }}" --tag "${{ github.ref_name }}"
            if ($LASTEXITCODE -ne 0) { Write-Error "Could not build the updater manifest."; exit 1 }
          }

          Get-ChildItem $out | ForEach-Object { "{0}`t{1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $version = (Get-Content orin-desktop-app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orin-code-installer
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        # Deliberately bash, not pwsh. `gh release upload` glob-expands its own
        # arguments, and a Windows path (D:\a\...) gets parsed as a glob, so the
        # upload silently did nothing while the step still exited 0. Under bash
        # the path is a literal and the upload works.
        shell: bash
        # gh does NOT pick up the runner's token on its own — it needs GH_TOKEN
        # set explicitly. This is the automatic GITHUB_TOKEN, not a stored
        # secret, and no credential is written into this file.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # A tag pushed without a release would fail here, so create it first.
          # --verify-tag refuses to invent a tag that was not actually pushed.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "Orin Code $tag" --generate-notes
          fi
          shopt -s nullglob
          files=(artifacts/*.exe artifacts/*.msi artifacts/*.zip artifacts/*.sig artifacts/latest.json)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no artifacts under artifacts/"; exit 1; fi
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "$tag" "${files[@]}" --clobber
          attached=$(gh release view "$tag" --json assets -q '.assets | length')
          if [ "$attached" -lt 1 ]; then echo "::error::release $tag has no assets after upload"; exit 1; fi
          gh release view "$tag" --json url -q .url

      # The updater broke four separate ways, and each produced a release that
      # looked healthy on the release page. Check the chain an installed app
      # actually walks: manifest -> asset -> bytes -> signature sibling.
      - name: Verify the published release is coherent
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node orin-desktop-app/scripts/verify-release.mjs

  verify-manifest:
    name: release invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Versions and updater config must agree
        run: |
          set -euo pipefail
          app="orin-desktop-app"
          conf="$app/src-tauri/tauri.conf.json"
          tauri=$(grep -o '"version"[^,]*' "$conf" | head -1 | cut -d'"' -f4)
          pkg=$(grep -o '"version"[^,]*' "$app/package.json" | head -1 | cut -d'"' -f4)
          cargo=$(grep -m1 '^version' "$app/src-tauri/Cargo.toml" | cut -d'"' -f2)
          echo "tauri=$tauri pkg=$pkg cargo=$cargo"
          if [ "$tauri" != "$pkg" ] || [ "$tauri" != "$cargo" ]; then
            echo "versions disagree - tauri=$tauri pkg=$pkg cargo=$cargo"
            exit 1
          fi
          grep -q '"createUpdaterArtifacts": true' "$conf" || { echo "createUpdaterArtifacts is off, so the updater has nothing to install"; exit 1; }
          grep -q '"updater"' "$conf" || { echo "the updater plugin is not configured"; exit 1; }
          grep -q '"pubkey"' "$conf" || { echo "the updater has no pubkey, so downloads cannot be verified"; exit 1; }
          grep -q '"endpoints"' "$conf" || { echo "the updater has no endpoint"; exit 1; }
          if git ls-files --error-unmatch "$app/updater" >/dev/null 2>&1; then
            echo "the updater PRIVATE key is tracked in git"
            exit 1
          fi
          echo "all release invariants hold for $tauri"
