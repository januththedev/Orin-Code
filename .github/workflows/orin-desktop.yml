name: Orin Desktop

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'orin-desktop-app/**'
      - '.github/workflows/orin-desktop.yml'
  pull_request:
    paths:
      - 'orin-desktop-app/**'
      - '.github/workflows/orin-desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orin-desktop-app/package-lock.json
      - name: Install renderer dependencies
        run: npm ci --prefix orin-desktop-app
      - name: Typecheck renderer
        run: npm run typecheck --prefix orin-desktop-app
      - name: Lint renderer
        run: npm run lint --prefix orin-desktop-app
      - name: Build renderer
        run: npm run build --prefix orin-desktop-app
      - name: Test Rust bridge
        run: cargo test --manifest-path orin-desktop-app/src-tauri/Cargo.toml
